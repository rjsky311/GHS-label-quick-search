<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Map the print stylesheet's CJK font families (macOS/Windows names plus the
  Google Fonts "Noto Sans TC" name) to the fonts-noto-cjk family that is
  installed in the backend image, so server-rendered label PDFs use
  Taiwan-standard glyph shapes instead of falling back to WenQuanYi Zen Hei.
-->
<fontconfig>
  <alias binding="strong">
    <family>Noto Sans TC</family>
    <accept><family>Noto Sans CJK TC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Microsoft JhengHei</family>
    <accept><family>Noto Sans CJK TC</family></accept>
  </alias>
  <alias binding="strong">
    <family>PingFang TC</family>
    <accept><family>Noto Sans CJK TC</family></accept>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
</fontconfig>
