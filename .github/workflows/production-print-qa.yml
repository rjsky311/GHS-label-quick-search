name: Production Print QA

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Production QA layer to run
        required: true
        default: product
        type: choice
        options:
          - product
          - health
          - smoke
          - primary
          - compact
          - multi-chemical
          - prepared
          - batch
          - full
          - all
      production_url:
        description: Frontend production URL
        required: false
        default: https://ghs.yuchelab.com/
        type: string
  schedule:
    - cron: "0 20 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: production-print-qa-${{ github.event_name }}-${{ github.event.inputs.mode || 'scheduled-product' }}
  cancel-in-progress: false

jobs:
  production-print-qa:
    name: Production print QA
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      PRINT_QA_HEADLESS: "1"
      PRINT_QA_PRODUCTION_URL: ${{ github.event.inputs.production_url || 'https://ghs.yuchelab.com/' }}
      PRINT_QA_EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRINT_QA_SUMMARY_REPORT_PATH: build/production-print-qa-summary.json
      PRODUCTION_HEALTH_ATTEMPTS: "60"
      PRODUCTION_HEALTH_RETRY_DELAY_MS: "5000"
      PRODUCTION_HEALTH_EXPECTED_NODE_MAJOR: "22"
      PRODUCTION_HEALTH_EXPECTED_BACKEND_ORIGIN: https://ghs-api.yuchelab.com

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Classify production QA relevance
        id: production_relevance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" ]]; then
            echo "run_full=true" >> "${GITHUB_OUTPUT}"
            echo "Manual and scheduled runs always execute the requested production QA." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "run_full=true" >> "${GITHUB_OUTPUT}"
            echo "Could not resolve the previous commit; running full production QA conservatively." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          changed_files=()
          while IFS= read -r changed_file; do
            changed_files+=("${changed_file}")
          done < <(git diff --name-only HEAD^ HEAD)
          relevance="$(../.github/scripts/classify-production-qa-change.sh "${changed_files[@]}")"
          if [[ "${relevance}" == "skip" ]]; then
            echo "run_full=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Production Print QA"
              echo
              echo "Skipped the deployed product walk because the successful main CI changed only documentation, workflow, tests, or explicitly non-runtime maintenance files."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "run_full=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.production_relevance.outputs.run_full == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align npm version
        if: steps.production_relevance.outputs.run_full == 'true'
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        if: steps.production_relevance.outputs.run_full == 'true'
        run: npm ci --no-audit

      - name: Check Chrome executable
        if: steps.production_relevance.outputs.run_full == 'true'
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Wait for production freshness
        if: steps.production_relevance.outputs.run_full == 'true'
        run: npm run qa:production-health

      - name: Check P-code wording coverage
        if: steps.production_relevance.outputs.run_full == 'true'
        run: npm run qa:p-code-coverage

      - name: Check H-code wording coverage
        if: steps.production_relevance.outputs.run_full == 'true'
        run: npm run qa:h-code-coverage

      - name: Run selected production print QA
        if: steps.production_relevance.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || 'product' }}"
          echo "Running production print QA mode: ${MODE}"
          case "${MODE}" in
            product)
              npm run qa:production-product
              ;;
            health)
              npm run qa:production-health
              npm run qa:production-pdf-canary
              npm run qa:production-summary
              ;;
            smoke)
              npm run qa:production-smoke
              ;;
            primary)
              npm run qa:production-primary
              ;;
            compact)
              npm run qa:production-compact
              ;;
            multi-chemical)
              npm run qa:production-multi-chemical
              ;;
            prepared)
              npm run qa:production-health
              npm run qa:production-pdf-canary
              npm run qa:production-bundle
              npm run qa:production-prepared
              npm run qa:production-summary
              ;;
            batch)
              npm run qa:production-health
              npm run qa:production-pdf-canary
              npm run qa:production-bundle
              npm run qa:production-batch-print
              npm run qa:production-summary
              ;;
            full)
              npm run qa:production-print
              ;;
            all)
              npm run qa:production-print
              npm run qa:production-prepared
              npm run qa:production-summary
              ;;
            *)
              echo "Unknown production print QA mode: ${MODE}" >&2
              exit 2
              ;;
          esac

      - name: Generate physical print validation plan
        if: always() && steps.production_relevance.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          if [ -f build/print-qa-report.json ]; then
            npm run qa:physical-print-plan
          else
            echo "Skipping physical print validation plan; build/print-qa-report.json was not generated for this mode."
          fi

      - name: Write production QA summary
        if: always() && steps.production_relevance.outputs.run_full == 'true'
        run: npm run qa:production-summary
        env:
          PRINT_QA_REQUIRE_PRODUCT_BLOCKS: ${{ contains(fromJSON('["product","full","all"]'), github.event.inputs.mode || 'product') && '1' || '0' }}
          PRINT_QA_ALLOW_EXTERNAL_UPSTREAM_BLOCKED: "1"

      - name: Add job summary
        if: always() && steps.production_relevance.outputs.run_full == 'true'
        run: |
          MODE="${{ github.event.inputs.mode || 'product' }}"
          node <<'NODE'
          const fs = require("fs");
          const p = "build/production-print-qa-summary.json";
          const r = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, "utf8")) : {};
          const blocks = Array.isArray(r.productBlocks) ? r.productBlocks : [];
          const failedBlocks = Array.isArray(r.summary?.failedProductBlocks)
            ? r.summary.failedProductBlocks
            : [];
          const failedFreshnessBlocks = Array.isArray(r.summary?.failedRequiredFreshnessBlocks)
            ? r.summary.failedRequiredFreshnessBlocks
            : [];
          const externallyBlockedBlocks = Array.isArray(r.summary?.externallyBlockedProductBlocks)
            ? r.summary.externallyBlockedProductBlocks
            : [];
          const failureTriage = Array.isArray(r.summary?.failureTriage)
            ? r.summary.failureTriage
            : [];
          const lines = [
            "## Production Print QA",
            "",
            `Mode: ${process.env.MODE}`,
            `OK: ${String(r.ok ?? "unknown")}`,
            `Status: ${r.statusCategory || "unknown"}`,
            `Present reports: ${String(r.summary?.presentReports ?? 0)}`,
            `Failed reports: ${String(r.summary?.failedReports ?? 0)}`,
            `Failed required freshness blocks: ${failedFreshnessBlocks.length ? failedFreshnessBlocks.join(", ") : "none"}`,
            `Failed product blocks: ${failedBlocks.length ? failedBlocks.join(", ") : "none"}`,
            `Externally blocked product blocks: ${externallyBlockedBlocks.length ? externallyBlockedBlocks.join(", ") : "none"}`,
            "",
          ];
          if (failureTriage.length) {
            lines.push("| Failure bucket | Count | Reports | Next action |", "| --- | ---: | --- | --- |");
            for (const item of failureTriage) {
              lines.push(
                `| ${item.label || item.bucket} | ${item.count || 0} | ${(item.reports || []).join(", ") || "-"} | ${item.nextAction || "-"} |`,
              );
            }
            lines.push("");
          }
          if (blocks.length) {
            lines.push("| Product block | Status |", "| --- | --- |");
            for (const block of blocks) {
              lines.push(`| ${block.name || block.id} | ${block.status || (block.ok ? "pass" : "fail")} |`);
            }
            lines.push("");
          }
          lines.push(
            "Artifact includes JSON reports, preview screenshots, print HTML artifacts, generated PDFs, and the physical print validation plan when present.",
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
        env:
          MODE: ${{ github.event.inputs.mode || 'product' }}

      - name: Upload production QA artifacts
        if: always() && steps.production_relevance.outputs.run_full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-print-qa-${{ github.event.inputs.mode || 'scheduled-product' }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/build/*.json
            frontend/build/physical-print-validation-plan.md
            frontend/build/production-*-screenshots/**
            frontend/build/print-html-artifacts/**
            frontend/build/print-pdf-artifacts/**
