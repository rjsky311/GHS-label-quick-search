name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check i18n parity
        run: npm run test:i18n

      - name: Check docs drift
        run: npm run test:docs

      - name: Lint frontend
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run QA script tests
        run: npm run test:qa-scripts

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run qa:bundle-budget

      - name: Check GitHub resource budget
        run: npm run qa:github-resource
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RESOURCE_REPO: ${{ github.repository }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check runtime dependency boundary
        run: python scripts/check_runtime_dependencies.py

      - name: Syntax check
        run: >
          python -m py_compile
          server.py
          api_models.py
          api_validation.py
          export_helpers.py
          h_code_translations.py
          h_code_coverage_audit.py
          observability.py
          pilot_admin_routes.py
          pilot_store.py
          inventory_workbook_audit.py
          inventory_handoff_import.py

      - name: Run tests
        run: python -m pytest -v

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
