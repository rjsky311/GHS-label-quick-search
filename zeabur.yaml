# Zeabur deployment configuration for GHS Label Quick Search

services:
  - name: ghs-backend
    type: docker
    context: ./backend
    dockerfile: Dockerfile
    ports:
      - 8001
    env:
      # Keep the first-party origin plus the temporary Zeabur rollback origin
      # during migration. Remove the latter only after retirement approval.
      # `*` is rejected at runtime because it is unsafe for a public API.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ghs.yuchelab.com,https://ghs-frontend.zeabur.app}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://ghs.yuchelab.com}
      # Surface the deployment commit to /api/health even when the runtime
      # image does not contain a .git directory.
      - BUILD_GIT_SHA=${ZEABUR_GIT_COMMIT_SHA}
    healthcheck:
      path: /api/health
      port: 8001

  - name: ghs-frontend
    type: static
    build:
      command: npm ci && npm run build
      output: build
    context: ./frontend
    env:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - VITE_PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://ghs.yuchelab.com}
